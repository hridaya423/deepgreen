[project]
name = "deep-green"
version = "0.1.0"
description = "Smallest pure-neural Wordle policy matching an exact oracle on a frozen OpenWordle-v1 benchmark."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "safetensors>=0.5",
    "mlx>=0.32; platform_machine=='arm64' and sys_platform=='darwin'",
    "torch>=2.7; sys_platform!='linux' or platform_machine!='aarch64'",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
wordle = "deep_green.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_green"]

[tool.ruff]
extend-exclude = ["vendor"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
]
