<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="model-version" content="__MODEL_VERSION__" />
    <link
      rel="preload"
      href="./model/weights.safetensors?v=__MODEL_VERSION__"
      as="fetch"
      crossorigin
    />
    <title>Deep Green</title>
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("wordle-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
