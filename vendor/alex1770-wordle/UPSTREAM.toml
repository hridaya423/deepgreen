# Pin record for the vendored alex1770 exact-search Wordle solver.
# Every upstream file at the pinned commit is recorded here, committed or withheld,
# so the pin stays complete and auditable. Withheld files are verbatim word lists
# and precomputed result/tree data the mission forbids committing; the oracle runs
# on benchmark-provided lists passed with -a/-h instead. Committed files are present
# byte-identical under this directory; withheld files are recoverable from upstream.
[upstream]
url = "https://github.com/alex1770/wordle"
commit = "8fd3f1bdf884ff6757c24ad1227dc561fab7787d"
license = "MIT"

[build]
compiler = "clang++ (Apple Clang; any C++17 toolchain works)"
flags = ["-std=c++17", "-O3", "-Wall"]
include_paths = ["compat"]

[build.notes]
gnu_error_h = "replaced by compat/error.h; same exit contract"
makefile = "upstream Makefile is informational; builds use clang++ -Icompat directly"
source_policy = "committed wordle.cpp is the pristine upstream blob; the JSONL event patch applies at build time into the build cache only"

[[patch]]
path = "patches/events-v1.patch"
base_sha256 = "a3bd676c581703a63e29bfe5e922cfe1409e5c3b276cd0ddbbe20ca5353d1a93"
purpose = "adds strict JSONL event output (-E flag): run identity, per-action exact/lower-bound records, checkpoints, result, and completion coverage counts; search semantics untouched"

